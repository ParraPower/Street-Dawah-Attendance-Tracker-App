version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: authapp-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data-local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ..
      dockerfile: AuthApp/Dockerfile
      target: build
    container_name: authapp-migrate-local
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /repo/AuthApp   # 👈 THIS IS THE KEY LINE
    environment:
      NODE_ENV: local
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    command: npm run migration:run -- local
    restart: "no"

  app:
    build:
      context: ..
      dockerfile: AuthApp/Dockerfile
      target: build
    container_name: authapp-api-local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: local
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    ports:
      - "4001:4001"
    volumes:
      - ../:/repo
    command: npm run start:local -w AuthApp

volumes:
  postgres-data-local:
